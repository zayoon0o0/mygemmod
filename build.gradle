plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

import groovy.json.JsonSlurper

def fabricJsonFile = file("src/main/resources/fabric.mod.json")
def fabricJson = new JsonSlurper().parse(fabricJsonFile)

def modId = fabricJson.id ?: "unknownmod"
def modVersion = fabricJson.version ?: "0.0.1"
def mcVersionRaw = fabricJson.minecraft ?: "26.1"
def mcVersion = mcVersionRaw.replaceAll("[^0-9.]", "")


tasks.jar {
    archiveBaseName.set(modId)
    archiveVersion.set("${modVersion}-mc${mcVersion}")
}

tasks.build {
    dependsOn(tasks.jar)
}


loom {
    mixin {
        add sourceSets.main, "mymod.mixins.json"
        defaultRefmapName = "mymod.refmap.json"
    }

    if (file("src/main/resources/META-INF/mymod.accesswidener").exists()) {
        accessWidenerPath = file("src/main/resources/META-INF/mymod.accesswidener")
    }
}


dependencies {
    minecraft "com.mojang:minecraft:26.1"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.144.1+26.1"
}


tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}


